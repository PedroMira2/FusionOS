<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8BFF" />
      <stop offset="100%" stop-color="#3A60D9" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#5B2BE0" />
    </linearGradient>
  </defs>
  
  <g transform="translate(30, 30)">
    <!-- Hexagon 1 -->
    <polygon points="25,0 75,0 100,43.3 75,86.6 25,86.6 0,43.3" fill="url(#grad1)" />
    <!-- Hexagon 2 -->
    <polygon points="65,25 115,25 140,68.3 115,111.6 65,111.6 40,68.3" fill="url(#grad2)" opacity="0.85" />
    <!-- Intersection -->
    <polygon points="65,25 75,0 100,43.3 75,86.6 65,111.6 40,68.3" fill="#7CA3FF" opacity="0.6" />
  </g>
  
  <text x="190" y="85" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="42" fill="#E8ECF5">FusionOS</text>
  <text x="195" y="115" font-family="Inter, system-ui, sans-serif" font-style="italic" font-size="14" fill="#6B7280">Make it yours.</text>
</svg>
