name: Compilar ISO FusionOS Oficial

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar a compilação com 1 clique no GitHub

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar FusionOS Live ISO (Fedora 41 KDE)
    runs-on: ubuntu-latest
    container:
      image: fedora:41
      options: --privileged # Necessário para montagem de loop devices e chroot

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Ferramentas de Compilação de ISO (Lorax e Anaconda)
        run: |
          dnf install -y lorax pykickstart anaconda anaconda-tui anaconda-live git

      - name: Validar Sintaxe do Kickstart
        run: |
          ksvalidator kickstart/fusionos-fedora.ks

      - name: Compilar Imagem ISO
        run: |
          # O Lorax exige que o diretório de destino NÃO exista previamente
          rm -rf output
          livemedia-creator \
            --ks=kickstart/fusionos-fedora.ks \
            --no-virt \
            --make-iso \
            --project="FusionOS-x86_64" \
            --releasever="41" \
            --volid="FusionOS_Live" \
            --iso-name="FusionOS-Live-x86_64.iso" \
            --resultdir=output

          # O Lorax costuma gerar o arquivo em output/images/boot.iso
          echo "Conteúdo do diretório de saída:"
          find output -type f -ls

          ISO_FOUND=$(find output -type f -name "*.iso" | head -n 1)
          if [ -n "$ISO_FOUND" ]; then
            echo "ISO gerada encontrada em: $ISO_FOUND"
            if [ "$ISO_FOUND" != "output/FusionOS-Live-x86_64.iso" ]; then
              cp -v "$ISO_FOUND" output/FusionOS-Live-x86_64.iso
            fi
            ls -lh output/FusionOS-Live-x86_64.iso
          else
            echo "ERRO: Nenhuma ISO foi encontrada em output!"
            exit 1
          fi

      - name: Fazer Upload da ISO Gerada (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FusionOS-Live-x86_64
          path: output/FusionOS-Live-x86_64.iso
          retention-days: 7
          if-no-files-found: error
