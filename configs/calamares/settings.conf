# ==============================================================================
# FusionOS Calamares Main Settings
# ==============================================================================
---
modules-search: [ local, /usr/lib64/calamares/modules, /usr/lib/calamares/modules ]

instances: []

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - grubcfg
        - bootloader
        - umount
    - show:
        - finished

branding: fusionos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
