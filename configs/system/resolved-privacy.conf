# ==============================================================================
# FusionOS Privacy & Encrypted DNS-over-TLS Specification
# Proposito: Bloqueio nativo de anuncios, telemetria e navegacao criptografada
# ==============================================================================

[Resolve]
# Servidores DNS com protecao contra phishing, malware e telemetria (Quad9 + AdGuard)
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 94.140.14.14#dns.adguard-dns.com
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com

# Criptografia obrigatoria de todas as requisicoes DNS (Zero espionagem de operadoras)
DNSOverTLS=yes
DNSSEC=allow-downgrade

# Cache inteligente para acelerar o carregamento de sites em qualquer navegador
Cache=yes
CacheTimeSliceSec=3600
MulticastDNS=yes
