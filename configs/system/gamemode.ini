# ==============================================================================
# FusionOS - GameMode Daemon Optimization Profile
# Proposito: Ativa perfil de ultra performance automaticamente ao abrir jogos
# ==============================================================================

[general]
reaper_freq=5
desiredgov=performance
igpu_desiredgov=performance
igpu_power_threshold=-1
softrealtime=auto
renice=4
ioprio=0

[filter]
# Ignora processos que nao sao jogos reais

[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=0
nv_powermizer_mode=1

[supervisor]

[custom]
# Desativa temporariamente animacoes pesadas do compositor enquanto joga
start=qdbus org.kde.KWin /Compositor suspend
end=qdbus org.kde.KWin /Compositor resume

