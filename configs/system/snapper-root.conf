# ==============================================================================
# FusionOS Snapper Configuration for Root Subvolume (Btrfs Time Machine)
# Proposito: Gerenciamento inteligente de snapshots sem ocupar espaco excessivo
# ==============================================================================

# Subvolume alvo
SUBVOLUME="/"
FSTYPE="btrfs"

# Snapshots em transações DNF/pacotes
ALLOW_USERS="liveuser"
SYNC_ACL="yes"

# Politica de retencao temporal (limites seguros para SSD/NVMe)
NUMBER_CLEANUP="yes"
NUMBER_MIN_AGE="1800"
NUMBER_LIMIT="10"
NUMBER_LIMIT_IMPORTANT="5"

TIMELINE_CREATE="yes"
TIMELINE_CLEANUP="yes"
TIMELINE_MIN_AGE="1800"
TIMELINE_LIMIT_HOURLY="5"
TIMELINE_LIMIT_DAILY="7"
TIMELINE_LIMIT_WEEKLY="2"
TIMELINE_LIMIT_MONTHLY="0"
TIMELINE_LIMIT_YEARLY="0"

# Limites de espaco em disco (% do disco total)
EMPTY_PRE_POST_CLEANUP="yes"
SPACE_LIMIT="0.5"
FREE_LIMIT="0.2"
