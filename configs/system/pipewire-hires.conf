# ==============================================================================
# FusionOS Audiophile Hi-Res PipeWire Specification
# Proposito: Audio de maxima fidelidade (bit-perfect / studio master)
# ==============================================================================

context.properties = {
    # Frequencias suportadas nativamente sem perdas (ate 384kHz de estudio)
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 384000 ]
    
    # Latencia ultra-baixa com protecao contra cortes
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 1024

    # Algoritmo de Resampling de Estudio SOXR (Maxima pureza acustica)
    resample.quality = 10
}

# Configuracoes de processamento de stream
stream.properties = {
    resample.quality = 10
    channelmix.normalize = false
    channelmix.mix-lfe   = true
    channelmix.upmix     = true
    channelmix.upmix-method = "psd"
    dither.noise = 0
}
