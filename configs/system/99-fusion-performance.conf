# ==============================================================================
# FusionOS - Extreme Performance & Gaming Kernel Tuning (sysctl)
# Propósito: Latência zero em jogos, I/O veloz para SSDs NVMe e rede ultra-rápida
# ==============================================================================

# 1. Compatibilidade com Jogos Windows (Proton / Wine / Anti-Cheats)
# Impede que jogos pesados crashem por falta de mapas de memória virtual
vm.max_map_count = 2147483642

# 2. Gerenciamento Inteligente de Memória RAM & ZRAM
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.page-cluster = 0

# 3. Escrita em Disco Suave (Evita stutterings e picos de I/O em SSDs)
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10

# 4. Limite de Arquivos Abertos e Watches (Essencial para jogos e compilação de código)
fs.file-max = 2097152
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024

# 5. Pilha de Rede Ultra-Rápida (Google BBR + CAKE + Buffer Tuning para Fibra 1Gbps+)
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_syncookies = 1

# 6. Agendador do Kernel e Preempção de Baixa Latência
kernel.sched_cfs_bandwidth_slice_us = 3000
