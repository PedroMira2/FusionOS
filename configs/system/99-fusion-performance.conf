# ==============================================================================
# FusionOS - Performance & Gaming Kernel Tuning (sysctl)
# Proposito: Eliminar engasgos do sistema, acelerar I/O e garantir compatibilidade
#            com jogos Windows modernos (Steam/Proton/Epic) e baixa latencia.
# ==============================================================================

# 1. Compatibilidade com Jogos Windows (Proton / Wine / Anti-Cheats)
# Impede que jogos pesados (como Hogwarts Legacy, Starfield, DayZ) crashem por falta de mapas de memoria
vm.max_map_count = 2147483642

# 2. Gerenciamento Inteligente de Memoria RAM
# Prioriza manter tudo na RAM fisica antes de usar swap/zram (default do Linux e 60, baixamos para 10)
vm.swappiness = 10
# Mantem indices de arquivos em cache na memoria para abertura instantanea de pastas e programas
vm.vfs_cache_pressure = 50

# 3. Escrita em Disco Suave (Evita congelamento do mouse ao copiar arquivos gigantes)
# Descarrega dados para o SSD gradualmente em vez de acumular em blocos gigantescos
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# 4. Limite de Arquivos Abertos (Essencial para desenvolvedores e servidores locais)
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288

# 5. Otimizacao de Rede e Latencia (Algoritmo BBR + CAKE)
# Reduz o jitter e ping em partidas online e downloads simultaneos (desenvolvido pelo Google)
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

