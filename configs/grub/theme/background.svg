<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="70%" stop-color="#0E1019"/>
      <stop offset="100%" stop-color="#07080D"/>
    </radialGradient>
    <radialGradient id="glowTop" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#5B8BFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5B8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D2B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#12141F" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Fundo principal -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowTop)"/>

  <!-- Moldura Glassmorphism para o Menu de Boot -->
  <rect x="384" y="360" width="1152" height="450" rx="16" ry="16" 
        fill="url(#cardGrad)" stroke="#2E3452" stroke-width="1.5"/>
</svg>
