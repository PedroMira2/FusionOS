# ==============================================================================
# FusionOS Crisp Mic - Filtro de Cancelamento de Ruído por IA em Tempo Real
# Baseado na rede neural recorrente RNNoise / DeepFilterNet integrado ao PipeWire
# ==============================================================================

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Fusion Crisp Mic (IA Noise Canceling)"
            media.name       = "Fusion Crisp Mic"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = librnnoise_ladspa
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 50.0
                            "VAD Grace Period (ms)" = 200.0
                            "Retroactive VAD Grace (ms)" = 0.0
                        }
                    }
                ]
            }
            capture.props = {
                node.name        = "capture.fusion_crisp_mic"
                node.passive     = true
                audio.rate       = 48000
            }
            playback.props = {
                node.name        = "fusion_crisp_mic"
                media.class      = "Audio/Source"
                audio.rate       = 48000
            }
        }
    }
]
