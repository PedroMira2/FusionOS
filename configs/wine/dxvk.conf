# ==============================================================================
# FusionOS DXVK & Direct3D Extreme Gaming Configuration
# Elimina engasgos de compilação de shaders DirectX e minimiza a latência de render
# ==============================================================================

# Compilação assíncrona de pipeline (Zero Stutter em jogos)
dxvk.enableAsync = true

# Utiliza todos os threads da CPU para compilação simultânea
dxvk.numCompilerThreads = 0

# Reduz latência de quadros na fila do DXGI para 1 frame
dxgi.maxFrameLatency = 1

# Sincronização de buffer de apresentação
dxgi.syncInterval = 0

# Otimizações de renderização
d3d11.maxTessFactor = 64
d3d11.samplerAnisotropy = 16
